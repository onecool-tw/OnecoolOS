name: Update Fund Weekly Analytics

on:
  workflow_dispatch:
  schedule:
    # 14:00 Asia/Taipei every Sunday (06:00 UTC), after Saturday's final
    # Market Dashboard and ETF CTA refreshes.
    - cron: "0 6 * * 0"

permissions:
  contents: write

concurrency:
  group: update-fund-weekly-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Refresh Market Dashboard before validation
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/update_market_dashboard.py
      - name: Refresh ETF CTA and WTI before fund calculations
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/update_etf_cta.py --allow-bootstrap
      - name: Refresh official AI evidence
        env:
          SEC_USER_AGENT: OnecoolOS research onecool-tw@users.noreply.github.com
        run: python scripts/update_ai_revolution.py
      - name: Refresh Global Market Rotation and TWD conversion
        run: python scripts/update_stockq_rotation.py
      - name: Refresh US Sector Rotation
        run: python scripts/update_sector_rotation.py
      - name: Refresh monthly Fundamental Cycle context
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 0'
        continue-on-error: true
        run: |
          day="$(date -u +%d)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$day" -le 7 ]; then
            python scripts/update_fundamental_cycle.py
          else
            echo "Fundamental Cycle refresh is limited to the first weekly run of each month."
          fi
      - name: Refresh weekly fund analytics
        run: python scripts/update_fund_alpha.py
      - name: Validate all Fund Intelligence inputs
        run: python scripts/validate_fund_intelligence.py
      - name: Commit the complete weekly preflight atomically
        run: |
          git add \
            data/market/dashboard \
            data/market/etf_cta \
            data/market/ai_revolution \
            data/market/stockq_rotation \
            data/market/sector_rotation \
            data/market/fundamental_cycle \
            data/market/fund_intelligence \
            data/market/fund_nav/history \
            data/market/fund_nav/fund_cta_latest.json \
            data/market/fund_nav/alpha_latest.json \
            data/market/fund_nav/peer_ranking_latest.json
          if git diff --cached --quiet; then
            echo "No new weekly fund analytics."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Fund Intelligence weekly preflight"
          git push
