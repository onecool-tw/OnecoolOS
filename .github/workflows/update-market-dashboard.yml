name: Update Market Dashboard

on:
  workflow_dispatch:
    inputs:
      refresh_actions_group:
        description: Refresh one API-safe dashboard dividend/split group
        required: false
        type: choice
        options:
          - none
          - group_a
          - group_b
        default: none
  schedule:
    # 05:00 Asia/Taipei, Tuesday-Saturday (21:00 UTC Monday-Friday).
    # This completes before the 10:30 US Stock Intelligence consumer runs.
    - cron: "0 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Update Market Dashboard cache
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          args=()
          # Prices refresh every run. Corporate actions rotate on Tuesday and
          # Wednesday Taipei time, away from the ETF CTA action groups.
          if [[ "${{ inputs.refresh_actions_group }}" != "" && "${{ inputs.refresh_actions_group }}" != "none" ]]; then
            args+=(--refresh-actions-group "${{ inputs.refresh_actions_group }}")
          elif [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%u)" == "1" ]]; then
            args+=(--refresh-actions-group group_a)
          elif [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%u)" == "2" ]]; then
            args+=(--refresh-actions-group group_b)
          fi
          python scripts/update_market_dashboard.py "${args[@]}"
      - name: Commit only a complete dashboard update
        run: |
          git add data/market/dashboard
          if git diff --cached --quiet; then
            echo "No new Market Dashboard data."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Market Dashboard"
          git push
