name: Update Market Dashboard

on:
  # Re-run after updater workflow/config changes so publication fixes are
  # validated immediately instead of waiting for the next market schedule.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-market-dashboard.yml"
      - "onecool_os/market/super_growth_quality.py"
      - "onecool_os/market/us_stock_quality.py"
      - "scripts/update_market_dashboard.py"
      - "scripts/update_us_stock_quality_context.py"
      - "config/us_stock_intelligence_master_prompt.md"
      - "data/market/us_stock_intelligence/super_growth_evidence_latest.json"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      refresh_actions_group:
        description: Refresh one API-safe dashboard dividend/split group
        required: false
        type: choice
        options:
          - none
          - group_a
          - group_b
        default: none
      refresh_us_scan:
        description: Refresh the same-cutoff US Breakout Scan and Daily Top 5
        required: false
        type: boolean
        default: true
  schedule:
    # US close primary run: 08:30 Asia/Taipei, Tuesday-Saturday.
    # During both US daylight-saving and standard time this leaves enough time
    # for Yahoo Finance to publish completed regular-session daily bars.
    - cron: "30 0 * * 2-6"
    # US close retry 1: 09:00 Asia/Taipei, Tuesday-Saturday.
    # A no-change run exits without committing.
    - cron: "0 1 * * 2-6"
    # US close retry 2: 09:30 Asia/Taipei, Tuesday-Saturday.
    # This is the final refresh before the 10:30 US Stock Intelligence report.
    - cron: "30 1 * * 2-6"
    # Asia close primary run: 17:00 Asia/Taipei, Monday-Friday.
    # This allows Yahoo Finance time to publish final Japan/Korea daily bars.
    - cron: "0 9 * * 1-5"
    # Asia close retry: 17:30 Asia/Taipei, Monday-Friday.
    # A no-change run exits without committing; a delayed daily bar is recovered.
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Update Market Dashboard cache
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          args=()
          # Prices refresh every run and the updater merges the latest 10 days,
          # so missed sessions are backfilled automatically. Alpha Vantage
          # corporate-action checks run only on the 08:30 primary schedule.
          if [[ "${{ inputs.refresh_actions_group }}" != "" && "${{ inputs.refresh_actions_group }}" != "none" ]]; then
            args+=(--refresh-actions-group "${{ inputs.refresh_actions_group }}")
          elif [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%H:%M)" == "00:30" && "$(date -u +%u)" == "2" ]]; then
            args+=(--refresh-actions-group group_a)
          elif [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%H:%M)" == "00:30" && "$(date -u +%u)" == "3" ]]; then
            args+=(--refresh-actions-group group_b)
          fi
          # The three US-close runs all refresh Daily Top 5.  Asia-close runs
          # preserve the last valid scan instead of mixing market cutoffs.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.refresh_us_scan }}" == "true" ]]; then
            args+=(--refresh-us-scan)
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # A publication-path/workflow recovery push must validate the full
            # US report, including the same-cutoff breakout scan artifact.
            args+=(--refresh-us-scan)
          elif [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%H)" =~ ^(00|01)$ ]]; then
            args+=(--refresh-us-scan)
          fi
          python scripts/update_market_dashboard.py "${args[@]}"
      - name: Commit only a complete dashboard update
        run: |
          git add data/market/dashboard data/market/us_stock_intelligence
          if git diff --cached --quiet; then
            echo "No new Market Dashboard data."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Market Dashboard"
          git push
