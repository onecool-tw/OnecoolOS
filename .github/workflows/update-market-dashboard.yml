name: Update Market Dashboard

# Recovery trigger: 2026-09-21 scheduled run was not emitted by GitHub Actions.

on:
  # Re-run after updater workflow/config changes so publication fixes are
  # validated immediately instead of waiting for the next market schedule.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-market-dashboard.yml"
      - "onecool_os/market/super_growth_quality.py"
      - "onecool_os/market/us_stock_quality.py"
      - "onecool_os/market/us_valuation_inputs.py"
      - "scripts/update_market_dashboard.py"
      - "onecool_os/market/us_breakout_scan.py"
      - "onecool_os/market/sec_fundamentals.py"
      - "config/sec_fundamental_tickers.json"
      - "onecool_os/market/session_cutoff.py"
      - "scripts/update_us_stock_quality_context.py"
      - "config/us_stock_intelligence_master_prompt.md"
      - "data/market/us_stock_intelligence/super_growth_evidence_latest.json"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      refresh_actions_group:
        description: Refresh one API-safe dashboard dividend/split group
        required: false
        type: choice
        options:
          - none
          - group_a
          - group_b
        default: none
      refresh_us_scan:
        description: Refresh the same-cutoff US Breakout Scan and Daily Top 5
        required: false
        type: boolean
        default: true
  schedule:
    # US close primary run: 08:30 Asia/Taipei, Tuesday-Saturday.
    # During both US daylight-saving and standard time this leaves enough time
    # for Yahoo Finance to publish completed regular-session daily bars.
    - cron: "30 0 * * 2-6"
    # US close retry: 09:30 Asia/Taipei, Tuesday-Saturday. The 10:15 health
    # monitor dispatches an additional recovery only when inputs stay blocked.
    - cron: "30 1 * * 2-6"
    # Asia close primary, mid-window retry, and final retry. The Taiwan screen
    # follows each successful Dashboard run; pre-report health owns recovery.
    - cron: "17 8 * * 1-5"
    - cron: "47 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A run may wait behind an earlier run in this workflow's concurrency
      # group. Check out main when the job actually starts so derived caches
      # are recomputed from the newest published baseline, not the stale event
      # SHA that originally queued the run.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Update Market Dashboard cache
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          args=()
          # Prices refresh every run and the updater merges the latest 10 days,
          # so missed sessions are backfilled automatically. Alpha Vantage
          # corporate-action checks run only on the 08:30 primary schedule.
          if [[ "${{ inputs.refresh_actions_group }}" != "" && "${{ inputs.refresh_actions_group }}" != "none" ]]; then
            args+=(--refresh-actions-group "${{ inputs.refresh_actions_group }}")
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 0 * * 2-6" && "$(date -u +%u)" == "2" ]]; then
            args+=(--refresh-actions-group group_a)
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 0 * * 2-6" && "$(date -u +%u)" == "3" ]]; then
            args+=(--refresh-actions-group group_b)
          fi
          # Every scheduled dashboard run refreshes Daily Top 5 against the
          # latest completed US session. This makes an Asia-close run a safe
          # recovery path when GitHub delays all US-close schedules: both the
          # Dashboard and Breakout Scan then publish the same US cutoff.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.refresh_us_scan }}" == "true" ]]; then
            args+=(--refresh-us-scan)
          elif [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "schedule" ]]; then
            args+=(--refresh-us-scan)
          fi
          python scripts/update_market_dashboard.py "${args[@]}"
      - name: Commit only a complete dashboard update
        run: |
          git add data/market/dashboard data/market/us_stock_intelligence
          if git diff --cached --quiet; then
            echo "No new Market Dashboard data."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Market Dashboard"
          bash scripts/push_cache_commit.sh
