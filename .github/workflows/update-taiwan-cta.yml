name: Update Taiwan CTA

# Recovery trigger: 2026-09-21 scheduled run was not emitted by GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      allow_bootstrap:
        description: Bootstrap missing histories with Yahoo
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-taiwan-cta.yml"
  schedule:
    # 15:00 primary plus 16:00 and 17:00 retries. Pre-report health dispatches
    # recovery only when the current-day CTA remains blocked.
    - cron: "0 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-taiwan-cta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main before calculating
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Update 0050 and 2330 CTA
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.allow_bootstrap }}" == "true" ]]; then
            args+=(--allow-bootstrap)
          fi
          python scripts/update_taiwan_cta.py "${args[@]}"
      - name: Export and verify read-only family snapshot
        run: |
          python scripts/export_taiwan_family_snapshot.py
          python scripts/export_taiwan_family_snapshot.py --check
      - name: Commit only when Taiwan market data changed
        run: |
          git add data/market/taiwan_cta data/public/taiwan_stock_family_latest.json
          if git diff --cached --quiet; then
            echo "No new Taiwan market data."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Taiwan CTA history"
          bash scripts/push_cache_commit.sh
