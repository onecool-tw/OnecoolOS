name: Update Taiwan CTA

on:
  workflow_dispatch:
    inputs:
      allow_bootstrap:
        description: Bootstrap missing histories with Yahoo
        required: false
        type: boolean
        default: true
  schedule:
    # 17:00 and 17:40 Asia/Taipei, Monday-Friday (09:00/09:40 UTC).
    # The second run is an idempotent fallback when the first scheduled run
    # is delayed or the latest complete Taiwan market data is not ready yet.
    - cron: "0 9 * * 1-5"
    - cron: "40 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-taiwan-cta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Update 0050 and 2330 CTA
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.allow_bootstrap }}" == "true" ]]; then
            args+=(--allow-bootstrap)
          fi
          python scripts/update_taiwan_cta.py "${args[@]}"
      - name: Commit only when Taiwan market data changed
        run: |
          git add data/market/taiwan_cta
          if git diff --cached --quiet; then
            echo "No new Taiwan market data."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Taiwan CTA history"
          git push
