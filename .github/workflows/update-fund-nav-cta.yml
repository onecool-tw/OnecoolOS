name: Update Fund NAV CTA

on:
  workflow_dispatch:
  schedule:
    # 08:30 Asia/Taipei, Monday-Saturday (00:30 UTC).
    # This leaves two hours before the 10:30 Fund CTA Daily output.
    - cron: "30 0 * * 1-6"

permissions:
  contents: write

concurrency:
  group: update-fund-nav-cta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Refresh seven fund NAV histories and CTA
        shell: bash
        run: |
          set -o pipefail
          status=1
          for attempt in 1 2; do
            echo "Fund NAV refresh attempt ${attempt}/2"
            if python scripts/update_fund_nav_cta.py; then
              status=0
              break
            else
              status=$?
              echo "::warning::Fund NAV refresh attempt ${attempt}/2 failed with exit code ${status}."
            fi
            if [ "${attempt}" -eq 1 ]; then
              sleep 30
            fi
          done
          if [ "${status}" -ne 0 ]; then
            echo "::error::Fund NAV refresh failed twice. Inspect the provider or Python error above."
            exit "${status}"
          fi
      - name: Validate and summarize published cache
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/market/fund_nav/fund_cta_latest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          results = payload.get("results", [])
          if len(results) != 7:
              raise SystemExit(f"Expected 7 funds, found {len(results)}")
          dates = sorted({item.get("fund_nav_as_of") for item in results})
          if None in dates:
              raise SystemExit("At least one fund is missing fund_nav_as_of")
          if payload.get("update_mode") != "DAILY_NAV_CTA_ONLY":
              raise SystemExit("Unexpected update_mode")
          if not payload.get("generated_at"):
              raise SystemExit("generated_at is missing")

          lines = [
              "## Fund NAV CTA refresh",
              "",
              f"- Generated at: `{payload['generated_at']}`",
              f"- Fund NAV dates: `{', '.join(dates)}`",
              f"- Funds: `{len(results)}`",
              "- Validation: `PASS`",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Commit only when daily NAV or CTA changed
        run: |
          git add \
            data/market/fund_nav/history \
            data/market/fund_nav/fund_cta_latest.json
          if git diff --cached --quiet; then
            echo "No new fund NAV or CTA data."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update daily fund NAV CTA"
          git push
