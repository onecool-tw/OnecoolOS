name: Update AI Revolution Evidence

on:
  workflow_dispatch:
  # The scheduled refresh is orchestrated by update-fund-weekly-analytics.yml
  # so all report caches are committed atomically. Keep manual dispatch here.

permissions:
  contents: write

concurrency:
  group: update-ai-revolution
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Refresh SEC and official IR evidence
        env:
          SEC_USER_AGENT: OnecoolOS research onecool-tw@users.noreply.github.com
        run: python scripts/update_ai_revolution.py
      - name: Commit AI Revolution evidence cache
        run: |
          git add data/market/ai_revolution
          if git diff --cached --quiet; then
            echo "No new AI Revolution evidence."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update AI Revolution evidence"
          git push
