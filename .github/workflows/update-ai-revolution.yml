name: Update AI Revolution Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/ai_revolution_review.json"
      - "onecool_os/market/ai_revolution.py"
      - "scripts/update_ai_revolution.py"
      - "scripts/publish_ai_revolution.sh"
      - ".github/workflows/update-ai-revolution.yml"
  # The scheduled refresh is orchestrated by update-fund-weekly-analytics.yml
  # so all report caches are committed atomically. Keep manual dispatch here.

permissions:
  contents: write

concurrency:
  group: update-ai-revolution
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Refresh and publish AI evidence, validation and health
        env:
          SEC_USER_AGENT: OnecoolOS research onecool-tw@users.noreply.github.com
        run: bash scripts/publish_ai_revolution.sh
