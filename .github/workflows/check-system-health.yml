name: Check Unified Schedule Health

on:
  workflow_run:
    workflows: ["Update Fund NAV CTA", "Update Taiwan Stock Screen"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-system-health.yml"
      - "data/operations/report_delivery/**"
      - "onecool_os/health/**"
      - "scripts/check_system_health.py"
  workflow_dispatch:
    inputs:
      scope:
        description: Health scope to evaluate for recovery and final gating
        required: true
        type: choice
        options:
          - all
          - morning
          - asia
          - weekly
        default: all
      phase:
        description: Primary dispatches one recovery; verify publishes and gates
        required: true
        type: choice
        options:
          - primary
          - verify
        default: primary
  schedule:
    # Daily report inputs: recover at 10:15 and run the final data gate at
    # 15:30 Taipei, after the 14:00 US dashboard retry.
    - cron: "15 2 * * 1-6"
    - cron: "30 7 * * 1-6"
    # Taiwan close inputs: start recovery before the 18:00 report, verify it,
    # then retain a final recovery/verification pair for delayed providers.
    - cron: "30 8 * * 1-5"
    - cron: "10 9 * * 1-5"
    - cron: "20 9 * * 1-5"
    - cron: "50 9 * * 1-5"
    # Weekly preflight: recover at 15:00 and verify at 16:00 Taipei Sunday.
    - cron: "0 7 * * 0"
    - cron: "0 8 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: unified-schedule-health-${{ github.event.schedule || inputs.scope || 'manual' }}
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve scheduled phase and scope
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_PHASE: ${{ inputs.phase }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            scope="${INPUT_SCOPE:-all}"
            phase="${INPUT_PHASE:-primary}"
          elif [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_run" ]; then
            scope="all"; phase="verify"
          else
            case "$EVENT_SCHEDULE" in
              "15 2 * * 1-6") scope="morning"; phase="primary" ;;
              "30 7 * * 1-6") scope="morning"; phase="verify" ;;
              "30 8 * * 1-5") scope="asia"; phase="primary" ;;
              "10 9 * * 1-5") scope="asia"; phase="verify" ;;
              "20 9 * * 1-5") scope="asia"; phase="primary" ;;
              "50 9 * * 1-5") scope="asia"; phase="verify" ;;
              "0 7 * * 0") scope="weekly"; phase="primary" ;;
              "0 8 * * 0") scope="weekly"; phase="verify" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
      - name: Install project
        run: pip install -e .
      - name: Evaluate all committed data caches
        id: health
        run: python scripts/check_system_health.py --scope "${{ steps.mode.outputs.scope }}"
      - name: Dispatch one safe recovery cycle
        if: (steps.mode.outputs.phase == 'primary' || github.event_name == 'push') && steps.health.outputs.blocked_count != '0'
        uses: actions/github-script@v7
        env:
          RECOVERY_WORKFLOWS: ${{ steps.health.outputs.recovery_workflows }}
        with:
          script: |
            const workflows = JSON.parse(process.env.RECOVERY_WORKFLOWS || '[]');
            for (const workflow_id of workflows) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main'
              });
              core.warning(`Dispatched recovery workflow: ${workflow_id}`);
            }
      - name: Publish verified health cache
        if: steps.mode.outputs.phase == 'verify'
        shell: bash
        run: |
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market/system_health/system_health_latest.json
          if git diff --cached --quiet; then
            echo "Health cache is unchanged."
            exit 0
          fi
          git commit -m "Update unified schedule health"
          bash scripts/push_cache_commit.sh
      - name: Fail only after recovery remains blocked
        if: steps.mode.outputs.phase == 'verify' && github.event_name != 'push' && steps.health.outputs.scope_status == 'BLOCKED'
        run: |
          echo "${{ steps.mode.outputs.scope }} health remains BLOCKED after the recovery window." >&2
          exit 1
      - name: Note non-blocking manual review
        if: steps.mode.outputs.phase == 'verify' && steps.health.outputs.scope_status == 'PARTIAL'
        run: echo "Health is PARTIAL. Reports remain usable with the limitations listed in the job summary."
