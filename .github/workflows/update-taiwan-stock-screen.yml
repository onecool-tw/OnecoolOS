name: Update Taiwan Stock Screen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Market Dashboard"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-taiwan-stock-screen.yml"
      - "onecool_os/market/taiwan_stock_screen.py"
      - "onecool_os/market/taiwan_stock_cta.py"
      - "onecool_os/market/taiwan_stock_intelligence.py"
      - "scripts/update_taiwan_stock_screen.py"
      - "scripts/update_taiwan_stock_cta.py"
      - "scripts/update_taiwan_stock_daily_context.py"
      - "config/taiwan_stock_intelligence_master_prompt.md"
      - ".gitignore"
      - "scripts/export_taiwan_family_snapshot.py"
      - "tests/test_taiwan_family_snapshot.py"
      - "onecool_os/market/session_cutoff.py"
      - "tests/test_taiwan_freshness.py"
      - "scripts/check_taiwan_report_readiness.py"
      - "tests/test_taiwan_report_readiness.py"
  schedule:
    # Start soon after Taiwan close; retries leave room before the 18:00 report.
    # GitHub cron is best effort, so readiness is checked independently.
    - cron: "17,47 6-8 * * 1-5"
    - cron: "17,37 9 * * 1-5"

permissions:
  contents: write

# This workflow and the formal market-pressure writer both touch
# daily_context_latest.json. Serialize them so neither can overwrite the other.
concurrency:
  group: taiwan-daily-context-writers
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main after acquiring writer lock
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Attempt official-data Taiwan stock screen refresh
        id: screen
        continue-on-error: true
        run: python scripts/update_taiwan_stock_screen.py
      - name: Maintain background CTA for the full 200-stock universe
        id: cta
        continue-on-error: true
        run: python scripts/update_taiwan_stock_cta.py
      - name: Publish daily context from the latest successful screen
        run: python scripts/update_taiwan_stock_daily_context.py
      - name: Export and verify read-only family snapshot
        run: |
          python scripts/export_taiwan_family_snapshot.py
          python scripts/export_taiwan_family_snapshot.py --check
      - name: Check same-session report readiness
        id: readiness
        continue-on-error: true
        run: python scripts/check_taiwan_report_readiness.py
      - name: Commit only when the validated screen changed
        run: |
          git add data/market/taiwan_stock_intelligence data/public/taiwan_stock_family_latest.json
          if git diff --cached --quiet; then
            echo "No new validated Taiwan stock screen."
            exit 0
          fi
          git config user.name "onecool-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Taiwan stock screen"
          # Another market updater may have committed while this job fetched
          # the slower MOPS endpoints. Rebase because the artifacts are on
          # independent paths, then publish the validated screen.
          git pull --rebase origin main
          git push
      - name: Warn when a transient source failure did not block readiness
        if: >-
          (steps.screen.outcome == 'failure' || steps.cta.outcome == 'failure') &&
          steps.readiness.outcome == 'success'
        run: |
          echo "::warning::A Taiwan source refresh attempt failed, but the final same-day report is READY."
      - name: Warn when an opportunistic refresh is incomplete
        if: >-
          steps.readiness.outcome == 'failure' &&
          (github.event_name == 'workflow_run' || github.event_name == 'push')
        run: |
          echo "::warning::Opportunistic Taiwan refresh incomplete; retained and published the last valid dated snapshot."
      - name: Report unsuccessful formal refresh after preserving the last valid snapshot
        if: >-
          steps.readiness.outcome == 'failure' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          echo "::error::Formal Taiwan refresh incomplete; retained source dates, not a current-day success."
          exit 1
