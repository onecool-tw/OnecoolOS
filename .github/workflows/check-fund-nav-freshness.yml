name: Check Fund NAV CTA Freshness

on:
  workflow_dispatch:
  schedule:
    # 10:15 Asia/Taipei, Monday-Friday (02:15 UTC), shortly before
    # the 10:30 Fund CTA Daily output.
    - cron: "15 2 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: check-fund-nav-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check whether today's daily cache was generated
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("data/market/fund_nav/fund_cta_latest.json")
          now_taipei = datetime.now(ZoneInfo("Asia/Taipei"))
          stale = True
          reason = "fund_cta_latest.json is missing"
          nav_dates = []
          generated_at = None

          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
              generated_at = payload.get("generated_at")
              nav_dates = sorted(
                  {
                      item.get("fund_nav_as_of")
                      for item in payload.get("results", [])
                      if item.get("fund_nav_as_of")
                  }
              )
              if generated_at:
                  generated = datetime.fromisoformat(
                      generated_at.replace("Z", "+00:00")
                  ).astimezone(ZoneInfo("Asia/Taipei"))
                  stale = generated.date() != now_taipei.date()
                  reason = (
                      f"cache generated on {generated.date()}, expected "
                      f"{now_taipei.date()}"
                      if stale
                      else "cache was generated today"
                  )
              else:
                  reason = "generated_at is missing"

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"stale={'true' if stale else 'false'}\n")
              handle.write(f"reason={reason}\n")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Fund NAV CTA freshness check",
              "",
              f"- Taipei date: `{now_taipei.date()}`",
              f"- Generated at: `{generated_at or 'MISSING'}`",
              f"- Fund NAV dates: `{', '.join(nav_dates) or 'MISSING'}`",
              f"- Result: `{'STALE — RECOVERY REQUIRED' if stale else 'FRESH'}`",
              f"- Reason: {reason}",
          ]
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Trigger recovery refresh when stale
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-fund-nav-cta.yml',
              ref: 'main'
            });
            core.warning(`Daily Fund NAV CTA cache is stale: ${{ steps.freshness.outputs.reason }}. Recovery refresh dispatched.`);
      - name: Confirm freshness
        if: steps.freshness.outputs.stale != 'true'
        run: echo "Daily Fund NAV CTA cache was generated today."
